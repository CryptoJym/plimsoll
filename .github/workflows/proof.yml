      - name: Prove copied Claude prefix imports only its suffix (N1)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-overlap_claude

      - name: Prove exchanged history parent cannot escape the root (N2)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
