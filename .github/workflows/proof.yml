name: signal-fidelity proof

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proof:
    runs-on: macos-14
    # Allow the measured sequential artifact, repeated E2E and resource gates.
    # Per-proof deadlines and acceptance thresholds remain unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the default PR synthetic-merge checkout, but fetch its ancestry
          # so the out-of-band source head can be proven to be an ancestor.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolate every proof home and provider root
        shell: bash
        run: |
          proof_home="${RUNNER_TEMP}/plimsoll-ci-home"
          mkdir -p "$proof_home/.plimsoll" "$proof_home/.codex" "$proof_home/.claude" "$proof_home/tmp"
          chmod 700 "$proof_home" "$proof_home/.plimsoll"
          {
            echo "HOME=$proof_home"
            echo "USERPROFILE=$proof_home"
            echo "PLIMSOLL_HOME=$proof_home/.plimsoll"
            echo "CODEX_HOME=$proof_home/.codex"
            echo "CLAUDE_CONFIG_DIR=$proof_home/.claude"
            echo "XDG_CONFIG_HOME=$proof_home/.config"
            echo "XDG_CACHE_HOME=$proof_home/.cache"
            echo "XDG_STATE_HOME=$proof_home/.local/state"
            echo "TMPDIR=$proof_home/tmp"
          } >> "$GITHUB_ENV"

      - name: Prove every proof script runs in CI or is reviewed local-only (eco-6hoxj.163.23)
        # Run with node, not pnpm, so no pnpm setting can turn the gate itself into a no-op.
        run: node ./node_modules/tsx/dist/cli.mjs ./scripts/ci-coverage-proof.ts

      - name: Typecheck
        id: typecheck
        run: pnpm exec tsc --noEmit

      - name: Reject incomplete proofs and require WAL, authentication and retention receipts
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:completion
          pnpm proof:startup-wal-self-heal
          pnpm proof:authenticated-ingestion
          pnpm proof:status-http-rollout
          pnpm proof:retention

      - name: Prove event allocation conservation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:allocation

      - name: Prove integrated capture, provenance, supervision and delivery
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:collector-reliability
          pnpm proof:collector-clock
          pnpm proof:lifecycle-manifest-rollback
          pnpm proof:dashboard-cdp
          pnpm proof:automatic-record-retry
          pnpm proof:automatic-revisit
          pnpm proof:oversized-continuation
          pnpm proof:oversized-continuation-storage
          PLIMSOLL_PROOF_HOME="$TMPDIR" pnpm proof:automatic-capture-cadence > evidence/automatic-capture-cadence-proof.json
          pnpm proof:automatic-retry-metadata
          pnpm proof:future-admission
          pnpm proof:child-identity
          pnpm proof:economics
          pnpm proof:live-usage-metadata
          pnpm proof:live-usage-projection
          pnpm proof:codex-live-usage
          pnpm proof:codex-live-reporting
          pnpm proof:finance-export
          pnpm proof:finance-projection
          pnpm proof:delivery
          pnpm proof:capture-claim
          pnpm proof:capture-claim-review
          pnpm proof:capture-claim-review-r4
          pnpm proof:capture-claim-review-r5
          pnpm proof:repo-labels-response

      - name: Prove source installer and read-only doctor
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:install-doctor

      - name: Prove validated collector homes stay isolated (#135)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:collector-home

      - name: Prove doctor names producer processes older than their managed config
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:doctor-stale-producers

      - name: Prove atomic no-follow LaunchAgent manifest lifecycle
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:launch-agent

      - name: Prove packaged runtime provenance and direct-Node LaunchAgent (#155)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:packaged-runtime

      - name: Verify and qualify the exact packed artifact
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm runtime:build
          pnpm runtime:verify
          pnpm proof:install-artifact

      - name: Prove truthful LaunchAgent unload and collector supervision
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm --dir packages/collector-cli build
          pnpm proof:launch-agent-unload
          pnpm proof:collector-supervision

      - name: Prove lifecycle receipts separate wrapper ownership and collector readiness (#148)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle-readiness

      - name: Prove hosted-runner flake classes stay fixed (#187)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:flake-regression

      - name: Prove surgical Codex config reconciliation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-config-apply

      - name: Prove the Codex producer token stays off the config surface and rotates
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-producer-token

      - name: Prove producer-token rotation for every source against a running collector (eco-6hoxj.152)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        # This proof's fixture-home guard refuses any sandbox that sits inside the runner account's
        # password-database home (/Users/runner). The job's synthetic HOME and TMPDIR live there, so this
        # one step gets a temp dir outside it; every fixture home the proof creates stays under that dir.
        run: |
          export TMPDIR="$(mktemp -d /private/tmp/plimsoll-rotation-proof.XXXXXX)"
          pnpm proof:producer-token-rotation

      - name: Prove desktop TOML reconciliation and independent setup targets
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:setup-toml-reconcile

      - name: Prove atomic Claude config reconciliation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:claude-config-apply

      - name: Prove managed Claude seat settings reconciliation (eco-6hoxj.48)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:claude-seats-apply

      - name: Prove managed Codex seat profile reconciliation (eco-6hoxj.52)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-profiles-apply

      - name: Prove self-healing managed Claude/Codex config reconcile (eco-6hoxj.50)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:managed-config-reconcile

      - name: Prove append-only capture-root registration (eco-6hoxj.53)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-roots-add

      - name: Prove producer-token rotation covers the Codex seat profiles (eco-6hoxj.54)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-rotation-profiles

      - name: Prove managed-config apply fails closed outside a fixture root
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:fixture-root-guard

      - name: Prove atomic local lifecycle transactions
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle

      - name: Prove one fenced lock for LaunchAgent mutations and versioned process fingerprints (#158/#175)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:lifecycle-fence
          pnpm proof:fingerprint-versioning

      - name: Prove packaged lifecycle operator commands end to end
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle-operator

      - name: Prove bounded lifecycle snapshot retention and space-free snapshots (eco-6hoxj.163.30)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle-retention

      - name: Prove lifecycle rollback and retention are data-safe (eco-6hoxj.163.30 r2)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle-data-safety

      - name: Prove bounded nonblocking Git metadata maintenance
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:git-context

      - name: Prove deferred repository context transaction and privacy bounds
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:repo-context

      - name: Prove bounded historical repository context replay and expiry
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:repo-context-drain

      - name: Prove incremental tailer context and cursor semantics
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:incremental-capture

      - name: Prove bounded Codex reconciliation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-reconciliation

      - name: Prove fair capture progress across concurrent generations
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-fairness

      - name: Prove capture budget reservation under repair backlog
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-budget

      - name: Prove Grok usage capture from Grok's own usage files (eco-6hoxj.163.20)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:grok-usage

      - name: Prove maintenance lock conflict rolls back for retry
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:sqlite-lock

      - name: Prove sync storage contention retry boundaries
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:sync-storage-retry

      - name: Prove partial-success sync backoff and server cooldowns (eco-6hoxj.67)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:sync-backoff

      - name: Prove daemon session sync catch-up without upload-history (eco-6hoxj.70.1)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:session-sync-daemon

      - name: Prove session sync ledger reads on the worker match the direct path (eco-6hoxj.163.11)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:session-sync-worker-parity

      - name: Prove bounded legacy outbox writer turns and retryable busy refusals (eco-6hoxj.163.11)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:studio0-writer-contention

      - name: Prove session-inherited project attribution and its upload-path bound (eco-6hoxj.163.9)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:session-attribution
          pnpm proof:session-attribution-bounded

      - name: Prove Codex account assertions and privacy boundary
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:account-assertion
          pnpm proof:account-salt

      - name: Prove local HTTP trust boundary
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:http-boundary
      - name: Prove zero-value OTLP span admission (eco-6hoxj.60)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:otlp-admission
      - name: Prove hook events survive collector 503/refused/reset via idempotent spool replay (eco-6hoxj.61 / .65)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:hook-spool
      - name: Prove refused OTLP exports are spooled and replayed exactly once (eco-6hoxj.163.17)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:otlp-intake-spool
      - name: Prove producer-to-ledger parity instrumentation (eco-6hoxj.29)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:producer-parity

      - name: Prove the Gemini CLI and Grok sources
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:gemini-adapter
          pnpm proof:grok-source
      - name: Prove bounded admission-rejection diagnostics (runner-scaled)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:rejection-aggregation
        env:
          REJECTION_PROOF_SCALE: "0.05"

      - name: Prove oversized ingest rejections and frozen summary liveness (#196)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:ingest-liveness

      - name: Prove isolated automatic maintenance availability
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:maintenance-boundary

      - name: Prove maintenance regressions and deadline starvation (#181)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:maintenance
          pnpm proof:maintenance-starvation

      - name: Prove maintenance stage primitives, worker readiness and the enrichment job
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:maintenance-stages
          pnpm proof:maintenance-worker-ready
          pnpm proof:enrichment-job

      - name: Prove maintenance stage integration
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:maintenance-stage-integration

      - name: Prove shipped dashboard projection truth
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:dashboard

      - name: Prove dashboard usage is not double-counted across ingest paths (#179/#193)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:usage-dedupe

      - name: Prove projection convergence and bounded token-time migration
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:projection-convergence
          pnpm proof:projection-active-convergence
          pnpm proof:last-token-event-backfill

      - name: Prove Jev receipt projection and authenticated access
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:jev-analysis

      - name: Legacy privacy parity proof
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:legacy-privacy-parity

      - name: Prove shipped dashboard browser security
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:dashboard-security

      - name: Prove race-safe dashboard DOM wait fixtures
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:dashboard-dom-wait

      - name: Prove paired attempts and explicit technique exposure
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:learning-facts

      - name: Prove runtime capture promotes bounded learning facts
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:runtime-facts

      - name: Run signal-fidelity proof
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof

      - name: Prove versioned learning-metric truth
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:metric-truth

      - name: Prove capacity planning doctrine gates
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capacity

      - name: Prove the Capacity Rail contract and provider capacity adapters (#168/#169)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:capacity-contract
          pnpm proof:capacity-adapters

      - name: Prove lane receipts, fleet operations and release qualification (#176/#154/#171)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:lane-receipts
          pnpm proof:fleet-operations
          pnpm proof:release-qualification

      - name: Prove bounded learning evidence packets
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:learning-evidence

      - name: Prove the bounded learning materializer (#157)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:learning-materializer

      - name: Prove suppression receipt capture-to-upload parity
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:outbox

      - name: Prove source-scoped validation rejections and replayable dead letters
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:upload-replay

      - name: Prove bounded daemon upload timer returns
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:upload-timer-bounds

      - name: Prove rollout lineage and reasoning-token upload
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:token-lineage

      - name: Prove managed metadata-only privacy mode
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:privacy-mode --receipt evidence/privacy-mode-proof.json

      - name: Prove transactional join and workspace isolation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:join-isolation

      - name: Prove future-only enrollment withholds pre-join history (eco-6hoxj.163.22)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:enrollment-privacy

      - name: Prove the device registry lifecycle and workspace-bound leases
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:device-registry

      - name: Prove immutable outcome timeline and bounded recovery
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:outcome-timeline

      - name: Prove the outcome performance layer
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:performance-layer

      - name: Prove source-only integrated learning and fleet flow
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:system-e2e:path-normalization
          pnpm proof:system-e2e -- --receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:verify -- --receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e -- --receipt evidence/system-e2e-proof-repeat.json --compare-deterministic-receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:verify -- --receipt evidence/system-e2e-proof-repeat.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:tamper -- --receipt evidence/system-e2e-proof-repeat.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run strict isolated resource proof
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: node ./node_modules/tsx/dist/cli.mjs ./scripts/resource-proof/index.ts --require-integrated --receipt evidence/resource-proof.json

      - name: Prove finalized privacy failures fail closed
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: node ./node_modules/tsx/dist/cli.mjs ./scripts/resource-proof/finalization-proof.ts

      - name: Prove owner shutdown is bounded, reaped and never silent (#162)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:owner-shutdown

      - name: Prove the published privacy spec derives from the source lists (#13)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:privacy-spec

      - name: Diff-check the published privacy spec freshness (#13)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm docs:privacy --check

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-fidelity-evidence
          path: evidence/
          if-no-files-found: warn
