name: signal-fidelity proof

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true


# Self-hosted runner labels don't imply a shell, so name it: bash with errexit, as on GitHub's macOS image.
defaults:
  run:
    shell: bash

jobs:
  proof:
    # James, 3 Oct 2026 12:05 MDT: no CI on GitHub's cloud; every check runs on our own machines.
    runs-on: [self-hosted, macOS, ARM64, plimsoll]
    # Allow the measured sequential artifact, repeated E2E and resource gates.
    # Per-proof deadlines and acceptance thresholds remain unchanged. A full run
    # took about 56 minutes on 30 Sep 2026, so 60 cut off healthy runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the default PR synthetic-merge checkout, but fetch its ancestry
          # so the out-of-band source head can be proven to be an ancestor.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # One pnpm folder per runner: runners sharing a Mac user raced in the default
          # ~/setup-pnpm (ENOTEMPTY, 'pnpm: command not found'; eco-6hoxj.165.179.2).
          dest: ~/setup-pnpm-runners/${{ runner.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolate every proof home and provider root
        shell: bash
        run: |
          proof_home="${RUNNER_TEMP}/plimsoll-ci-home"
          mkdir -p "$proof_home/.plimsoll" "$proof_home/.codex" "$proof_home/.claude" "$proof_home/tmp"
          chmod 700 "$proof_home" "$proof_home/.plimsoll"
          {
            echo "HOME=$proof_home"
            echo "USERPROFILE=$proof_home"
            echo "PLIMSOLL_HOME=$proof_home/.plimsoll"
            echo "CODEX_HOME=$proof_home/.codex"
            echo "CLAUDE_CONFIG_DIR=$proof_home/.claude"
            echo "XDG_CONFIG_HOME=$proof_home/.config"
            echo "XDG_CACHE_HOME=$proof_home/.cache"
            echo "XDG_STATE_HOME=$proof_home/.local/state"
            echo "TMPDIR=$proof_home/tmp"
          } >> "$GITHUB_ENV"

      - name: Prove every proof script runs in CI or is reviewed local-only (eco-6hoxj.163.23)
        # Run through the isolated proof wrapper, not pnpm, so pnpm config cannot skip the gate.
        run: node ./node_modules/tsx/dist/cli.mjs scripts/run-proof.ts scripts/ci-coverage-proof.ts

      - name: Prove Studio0 replacement ledger cutover safety (PR 426 round 6)
        run: |
          pnpm proof:pr426-r6-cutover-append-race
          pnpm proof:pr426-r6-archive-permissions
          pnpm proof:pr426-r6-min-version-045
          pnpm proof:pr426-r6-older-week-backlog
          pnpm proof:pr426-r6-unseen-file-clock-skew
          pnpm proof:pr426-r6-rollback-weekly-total
          pnpm proof:pr426-r6-read-only-preflight-sidecars
          pnpm proof:pr426-r6-archive-query-plans
          pnpm proof:pr426-r6-carry-budget
          pnpm proof:pr426-r6-crash-mid-carry
          pnpm proof:pr426-r6-stale-generation-growth

      - name: Prove replacement and restore recovery boundaries (PR 426 round 7)
        run: |
          pnpm proof:pr426-r7-replaced-during-switch
          pnpm proof:pr426-r7-append-before-first-scan
          pnpm proof:pr426-r7-replace-after-rename
          pnpm proof:pr426-r7-restore-weekly-control
          pnpm proof:pr426-r7-plan-open-refusal-sidecars
          pnpm proof:pr426-r7-restore-rerun

      - name: Prove post-swap fence and restore stage provenance (PR 426 round 8)
        run: |
          pnpm proof:pr426-r8-swap-replacement-race
          pnpm proof:pr426-r8-same-generation-append
          pnpm proof:pr426-r8-foreign-restore-stage
          pnpm proof:pr426-r8-restore-sidecar-inventory
          pnpm proof:pr426-r8-restore-sidecar-checkpoint

      - name: Prove read-time generation admission and archive-only restore retries (PR 426 round 9)
        run: |
          pnpm proof:pr426-r9-untracked-swap-race
          pnpm proof:pr426-r9-carried-post-stat-race
          pnpm proof:pr426-r9-rename-fsync-record
          pnpm proof:pr426-r9-restore-content-reclone
          pnpm proof:pr426-r9-restore-clone-fsync-retry
          pnpm proof:pr426-r9-restore-journal-fsync-retry
          pnpm proof:pr426-r9-restore-nonce-reclone
          pnpm proof:pr426-r10-new-path-after-rename
          pnpm proof:pr426-r10-new-session-restart
          pnpm proof:pr426-r10-untimestamped-new-path
          pnpm proof:pr426-r10-rename-delay-report
          pnpm proof:pr426-r10-epoch-fixture

      - name: Prove forward-skew records occur exactly once across archive and fresh ledger (PR 426 round 11)
        run: |
          pnpm proof:pr426-r11-review-pre-rename-missed
          pnpm proof:pr426-r11-review-during-rename
          pnpm proof:pr426-r11-review-future-skew
          pnpm proof:pr426-r11-review-future-skew-only
          pnpm proof:pr426-r11-review-stamp-boundary
          pnpm proof:pr426-r11-review-backward-skew
          pnpm proof:pr426-r11-review-hook-first
          pnpm proof:pr426-r11-review-crash-markers
          pnpm proof:pr426-r11-exactly-once
          pnpm proof:pr426-r11-window-measurement

      - name: Prove ledger connection fencing and conservative forward window (PR 426 round 13)
        run: |
          pnpm proof:pr426-r13-real-collector-opener
          pnpm proof:pr426-r13-raw-old-handle
          pnpm proof:pr426-r13-forward-window-bound
          pnpm proof:pr426-r13-cutover-recovery
          pnpm proof:pr426-r13-cli-refusal
          pnpm proof:pr426-r13-supervised-restart
          pnpm proof:pr426-r13-shared-lifetime
          pnpm proof:pr426-r13-old-connection
          pnpm proof:pr426-r13-missing-marker-recovery
          pnpm proof:pr426-r13-integrity-recovery
          pnpm proof:pr426-r13-post-check-raw-handle
          pnpm proof:pr426-r13-startup-marker-recovery
          pnpm proof:pr426-r13-startup-integrity-recovery

      - name: Prove one cutover wins and live collector connections refuse both (PR 426 round 17)
        run: |
          pnpm proof:pr426-r17-two-switch-race
          pnpm proof:pr426-r17-open-collector-two-switch

      - name: Typecheck
        id: typecheck
        run: pnpm exec tsc --noEmit

      # eco-6hoxj.164.4 (lean Plimsoll B0): contract tests that FAIL today by design.
      # Each is declared pending("<bead>") (node:test todo), so the step prints every
      # failure and exits 0 until the named bead removes the marker; from then on the
      # test blocks. Not a proof: tests/contracts/lean/README.md.
      - name: Lean contract tests (pending until their beads land)
        run: pnpm contracts:lean

      - name: Prove concurrent first opens of a fresh ledger (eco-6hoxj.163.130)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:startup-schema-race

      - name: Reject incomplete proofs and require WAL, authentication and retention receipts
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:completion
          pnpm proof:startup-wal-self-heal
          pnpm proof:authenticated-ingestion
          pnpm proof:status-http-rollout
          pnpm proof:retention
          pnpm proof:retention-null-generation-privacy
          pnpm proof:retention-upgrade-downgrade
          pnpm proof:retention-reused-id-downgrade
          pnpm proof:retention-repeated-reuse-downgrade
          pnpm proof:retention-reused-id-privacy-collision
          pnpm proof:retention-reused-id-privacy-rowid
          pnpm proof:retention-repeated-reuse-property
          pnpm proof:retention-stale-outbox-link
          pnpm proof:retention-restamp-lineage
          pnpm proof:retention-v2-trigger-upgrade
          pnpm proof:retention-lease-lineage-aba
          pnpm proof:retention-receipt-migration-crash
          pnpm proof:retention-0739-privacy
          pnpm proof:retention-0739-delivery
          pnpm proof:retention-0739-v44-rollback
          pnpm proof:retention-missing-raw
          pnpm proof:retention-event-detail-outbox
          pnpm proof:retention-generation-count
          pnpm proof:retention-worker-fence
          pnpm proof:retention-worker-close

      - name: Prove 0.7.44 dead-receipt lineage scale
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:receipt-lineage-scale

      - name: Prove event allocation conservation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:allocation

      - name: Prove bound usage links to work and exports opaque work refs (eco-6hoxj.163.104)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:work-linkage
          pnpm proof:work-ref

      - name: Prove integrated capture, provenance, supervision and delivery
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm proof:collector-reliability
          pnpm proof:collector-clock
          pnpm proof:lifecycle-manifest-rollback
          pnpm proof:dashboard-cdp
          pnpm proof:automatic-record-retry
          pnpm proof:automatic-revisit
          pnpm proof:oversized-continuation
          pnpm proof:oversized-continuation-storage
          PLIMSOLL_PROOF_HOME="$TMPDIR" pnpm proof:automatic-capture-cadence > evidence/automatic-capture-cadence-proof.json
          pnpm proof:automatic-retry-metadata
          pnpm proof:future-admission
          pnpm proof:child-identity
          pnpm proof:economics
          pnpm proof:live-usage-metadata
          pnpm proof:live-usage-projection
          pnpm proof:codex-live-usage
          pnpm proof:codex-live-reporting
          pnpm proof:finance-export
          pnpm proof:finance-projection
          pnpm proof:delivery
          pnpm proof:loopback-proxy
          pnpm proof:managed-curl-proxy
          pnpm proof:direct-loopback-timeout
          pnpm proof:capture-claim
          pnpm proof:capture-claim-review
          pnpm proof:capture-claim-review-r4
          pnpm proof:capture-claim-review-r5
          pnpm proof:repo-labels-response

      - name: Prove source installer and read-only doctor
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:install-doctor

      - name: Prove validated collector homes stay isolated (#135)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:collector-home

      - name: Prove doctor names producer processes older than their managed config
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:doctor-stale-producers

      - name: Prove tsx IPC pipe collisions cannot block proof children
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:tsx-ipc-pipe

      - name: Prove packaged runtime provenance and direct-Node LaunchAgent (#155)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:packaged-runtime

      - name: Verify and qualify the exact packed artifact
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm runtime:build
          pnpm runtime:verify
          pnpm proof:install-artifact

      - name: Prove truthful LaunchAgent unload and collector supervision
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: |
          pnpm --dir packages/collector-cli build
          pnpm proof:launch-agent-unload

      - name: Prove lifecycle receipts separate wrapper ownership and collector readiness (#148)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:lifecycle-readiness

      - name: Prove one kickstart for a loaded LaunchAgent with zero runs (eco-6hoxj.163.91)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:launch-agent-kickstart

      - name: Prove hosted-runner flake classes stay fixed (#187)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:flake-regression

      - name: Prove surgical Codex config reconciliation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-config-apply

      - name: Prove the Codex producer token stays off the config surface and rotates
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-producer-token

      - name: Prove producer-token rotation for every source against a running collector (eco-6hoxj.152)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        # This proof's fixture-home guard refuses any sandbox that sits inside the runner account's
        # password-database home (/Users/runner). The job's synthetic HOME and TMPDIR live there, so this
        # one step gets a temp dir outside it; every fixture home the proof creates stays under that dir.
        run: |
          export TMPDIR="$(mktemp -d /private/tmp/plimsoll-rotation-proof.XXXXXX)"
          pnpm proof:producer-token-rotation

      - name: Prove desktop TOML reconciliation and independent setup targets
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:setup-toml-reconcile

      - name: Prove atomic Claude config reconciliation
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:claude-config-apply

      - name: Prove managed Claude seat settings reconciliation (eco-6hoxj.48)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:claude-seats-apply

      - name: Prove managed Codex seat profile reconciliation (eco-6hoxj.52)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:codex-profiles-apply

      - name: Prove self-healing managed Claude/Codex config reconcile (eco-6hoxj.50)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:managed-config-reconcile

      - name: Prove append-only capture-root registration (eco-6hoxj.53)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-roots-add

      - name: Prove fenced pre-enrollment history import (eco-6hoxj.163.89)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import

      - name: Prove bounded and resumable history writer slices (eco-6hoxj.163.89 r2)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-slices

      - name: Prove history writer handoff to concurrent intake (eco-6hoxj.163.89 r3)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-writer-handoff

      - name: Prove history writer has no per-row schema work (eco-6hoxj.163.89 r4)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-writer-schema

      - name: Prove history prefix verification before publication (F1)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f1

      - name: Prove history parser handoff to tailers (F2)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f2

      - name: Prove history cross-root session continuity (F3)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f3

      - name: Prove exclusive history import lock (F4)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f4

      - name: Prove outbound history provenance marker (F5)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f5

      - name: Prove unique history apply receipts (F6)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f6

      - name: Prove history file swap refusal (F7)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: pnpm proof:capture-history-import-f7

      - name: Prove copied Codex prefix imports only its suffix (N1)
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
