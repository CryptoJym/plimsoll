name: signal-fidelity proof

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proof:
    runs-on: macos-14
    # Allow the measured sequential artifact, repeated E2E and resource gates.
    # Per-proof deadlines and acceptance thresholds remain unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the default PR synthetic-merge checkout, but fetch its ancestry
          # so the out-of-band source head can be proven to be an ancestor.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolate every proof home and provider root
        shell: bash
        run: |
          proof_home="${RUNNER_TEMP}/plimsoll-ci-home"
          mkdir -p "$proof_home/.plimsoll" "$proof_home/.codex" "$proof_home/.claude" "$proof_home/tmp"
          chmod 700 "$proof_home" "$proof_home/.plimsoll"
          {
            echo "HOME=$proof_home"
            echo "USERPROFILE=$proof_home"
            echo "PLIMSOLL_HOME=$proof_home/.plimsoll"
            echo "CODEX_HOME=$proof_home/.codex"
            echo "CLAUDE_CONFIG_DIR=$proof_home/.claude"
            echo "XDG_CONFIG_HOME=$proof_home/.config"
            echo "XDG_CACHE_HOME=$proof_home/.cache"
            echo "XDG_STATE_HOME=$proof_home/.local/state"
            echo "TMPDIR=$proof_home/tmp"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Reject incomplete proofs and require WAL, authentication and retention receipts
        run: |
          pnpm proof:completion
          pnpm proof:startup-wal-self-heal
          pnpm proof:authenticated-ingestion
          pnpm proof:retention

      - name: Prove event allocation conservation
        run: pnpm proof:allocation

      - name: Prove integrated capture, provenance, supervision and delivery
        run: |
          pnpm proof:collector-reliability
          pnpm proof:collector-clock
          pnpm proof:child-identity
          pnpm proof:economics
          pnpm proof:finance-export
          pnpm proof:finance-projection
          pnpm proof:delivery
          pnpm proof:repo-labels-response

      - name: Prove source installer and read-only doctor
        run: pnpm proof:install-doctor

      - name: Prove atomic no-follow LaunchAgent manifest lifecycle
        run: pnpm proof:launch-agent

      - name: Prove packaged runtime provenance and direct-Node LaunchAgent (#155)
        run: pnpm proof:packaged-runtime

      - name: Verify and qualify the exact packed artifact
        run: |
          pnpm runtime:build
          pnpm runtime:verify
          pnpm proof:install-artifact

      - name: Prove truthful LaunchAgent unload and collector supervision
        run: |
          pnpm --dir packages/collector-cli build
          pnpm proof:launch-agent-unload
          pnpm proof:collector-supervision

      - name: Prove lifecycle receipts separate wrapper ownership and collector readiness (#148)
        run: pnpm proof:lifecycle-readiness

      - name: Prove hosted-runner flake classes stay fixed (#187)
        run: pnpm proof:flake-regression

      - name: Prove surgical Codex config reconciliation
        run: pnpm proof:codex-config-apply

      - name: Prove atomic Claude config reconciliation
        run: pnpm proof:claude-config-apply

      - name: Prove atomic local lifecycle transactions
        run: pnpm proof:lifecycle

      - name: Prove packaged lifecycle operator commands end to end
        run: pnpm proof:lifecycle-operator

      - name: Prove bounded nonblocking Git metadata maintenance
        run: pnpm proof:git-context

      - name: Prove deferred repository context transaction and privacy bounds
        run: pnpm proof:repo-context

      - name: Prove incremental tailer context and cursor semantics
        run: pnpm proof:incremental-capture

      - name: Prove fair capture progress across concurrent generations
        run: pnpm proof:capture-fairness

      - name: Prove local HTTP trust boundary
        run: pnpm proof:http-boundary
      - name: Prove bounded admission-rejection diagnostics (runner-scaled)
        run: pnpm proof:rejection-aggregation
        env:
          REJECTION_PROOF_SCALE: "0.05"

      - name: Prove isolated automatic maintenance availability
        run: pnpm proof:maintenance-boundary

      - name: Prove shipped dashboard projection truth
        run: pnpm proof:dashboard

      - name: Prove shipped dashboard browser security
        run: pnpm proof:dashboard-security

      - name: Prove race-safe dashboard DOM wait fixtures
        run: pnpm proof:dashboard-dom-wait

      - name: Prove paired attempts and explicit technique exposure
        run: pnpm proof:learning-facts

      - name: Prove runtime capture promotes bounded learning facts
        run: pnpm proof:runtime-facts

      - name: Run signal-fidelity proof
        run: pnpm proof

      - name: Prove versioned learning-metric truth
        run: pnpm proof:metric-truth

      - name: Prove capacity planning doctrine gates
        run: pnpm proof:capacity

      - name: Prove bounded learning evidence packets
        run: pnpm proof:learning-evidence

      - name: Prove suppression receipt capture-to-upload parity
        run: pnpm proof:outbox

      - name: Prove managed metadata-only privacy mode
        run: pnpm proof:privacy-mode --receipt evidence/privacy-mode-proof.json

      - name: Prove transactional join and workspace isolation
        run: pnpm proof:join-isolation

      - name: Prove immutable outcome timeline and bounded recovery
        run: pnpm proof:outcome-timeline

      - name: Prove source-only integrated learning and fleet flow
        run: |
          pnpm proof:system-e2e:path-normalization
          pnpm proof:system-e2e -- --receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:verify -- --receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e -- --receipt evidence/system-e2e-proof-repeat.json --compare-deterministic-receipt evidence/system-e2e-proof.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:verify -- --receipt evidence/system-e2e-proof-repeat.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
          pnpm proof:system-e2e:tamper -- --receipt evidence/system-e2e-proof-repeat.json --expected-source-commit "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run strict isolated resource proof
        run: node ./node_modules/tsx/dist/cli.mjs ./scripts/resource-proof/index.ts --require-integrated --receipt evidence/resource-proof.json

      - name: Prove finalized privacy failures fail closed
        run: node ./node_modules/tsx/dist/cli.mjs ./scripts/resource-proof/finalization-proof.ts

      - name: Prove the published privacy spec derives from the source lists (#13)
        run: pnpm proof:privacy-spec

      - name: Diff-check the published privacy spec freshness (#13)
        run: pnpm docs:privacy --check

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-fidelity-evidence
          path: evidence/
          if-no-files-found: warn
